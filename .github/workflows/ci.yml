name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nvidia-runtime:
    name: NVIDIA runtime clean startup regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore the known incomplete official release runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'GoAgent-0.4.21-win-x64-nvidia-portable.7z'
          Invoke-WebRequest 'https://github.com/wimi321/GoAgent/releases/download/v0.4.21/GoAgent-0.4.21-win-x64-nvidia-portable.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '7b52ab7e87e3356c22f28ec028bb7c91f2e825f9e78ddcb894f0d313ab2ac8a8') { throw 'Regression archive SHA-256 mismatch' }
          & 7z x $archive '-o.nvidia-regression' 'resources/data/katago/bin/win32-x64/*' -y
          if ($LASTEXITCODE -ne 0) { throw 'Regression runtime extraction failed' }
      - name: Reject original missing NVRTC even if runner has CUDA installed
        shell: pwsh
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import {checkWindowsRuntimeDependencies} from './scripts/lib/windows_pe_dependencies.mjs'; await assert.rejects(checkWindowsRuntimeDependencies('.nvidia-regression/resources/data/katago/bin/win32-x64', {nvidia:true}), {message:'Missing bundled dependency: katago.exe -> nvrtc64_120_0.dll'}); console.log('Original package rejected: missing bundled nvrtc64_120_0.dll');" | Tee-Object -FilePath .nvidia-regression/before.log
          if ($LASTEXITCODE -ne 0) { throw 'Missing NVRTC regression assertion failed' }
      - name: Prepare and execute corrected runtime with clean environment
        shell: pwsh
        run: |
          node scripts/prepare_nvidia_nvrtc.mjs --runtime-dir=.nvidia-regression/resources/data/katago/bin/win32-x64
          if ($LASTEXITCODE -ne 0) { throw 'NVRTC preparation failed' }
          node scripts/check_windows_katago_runtime.mjs --runtime-dir=.nvidia-regression/resources/data/katago/bin/win32-x64 --nvidia --evidence=.nvidia-regression/after.json
          if ($LASTEXITCODE -ne 0) { throw 'Clean executable version probe failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nvidia-clean-startup-evidence
          path: |
            .nvidia-regression/before.log
            .nvidia-regression/after.json

  website:
    name: Website build and download checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --filter @goagent/website... --frozen-lockfile --ignore-scripts
      - run: pnpm website:build
      - run: pnpm check:website
      - run: pnpm --dir website exec astro check
      - run: node --test website/tests/*.test.mjs

  build:
    name: Typecheck and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Codex App Server manifest
        run: pnpm check:codex-runtime

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build app
        run: pnpm build

      - name: Package directory with embedded Codex runtime
        run: pnpm package:dir

      - name: Initialize packaged Codex App Server
        run: pnpm smoke:codex-runtime
